name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e-tests:
    # Snapshots use the file: migration URI, which needs QEMU 8.2 or later.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils zstd

      # Hosted runners have /dev/kvm, but only root may open it by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the browser VM image
        run: vm/scripts/build.js

      - name: Run E2E tests
        run: npx playwright test
        env:
          SESSION_SECRET: dummy-session-secret-dummy-session-secret
          RESOURCE_HMAC_SECRET: dummy-resource-hmac-secret-dummy
