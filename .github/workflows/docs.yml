name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Start Zensical server
        run: uv run zensical serve --dev-addr 127.0.0.1:8000 &

      - name: Wait for the server
        run: timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8000/ > /dev/null; do sleep 1; done'
