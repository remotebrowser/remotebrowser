name: Unit Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          SESSION_SECRET: dummy-session-secret-dummy-session-secret
          RESOURCE_HMAC_SECRET: dummy-resource-hmac-secret-dummy
