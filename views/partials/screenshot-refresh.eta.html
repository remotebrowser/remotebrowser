<script nonce="<%= it.scriptNonce %>">
  // A poll's swap recreates each screenshot <img> and screencast <canvas>,
  // which blanks them. Keep the old nodes instead, and switch an <img> to
  // its new frame only once decoded, since setting .src blanks it too.
  // The stash is not cleared after a swap, as htmx fires after-swap once
  // per swapped element, including out-of-band ones.
  let outgoingScreenshots = new Map();

  const stashScreenshots = (target) => {
    outgoingScreenshots = new Map(
      [...target.querySelectorAll('img[id^="screenshot-"], canvas[id^="screencast-"]')].map((node) => [node.id, node])
    );
  };

  const swapWhenDecoded = (img, src) => {
    if (img.src === src) return;
    img.dataset.pendingSrc = src;
    const next = new Image();
    next.src = src;
    next
      .decode()
      .then(() => {
        if (img.dataset.pendingSrc === src) img.src = src;
      })
      .catch(() => {});
  };

  const restoreScreenshots = (swapped) => {
    for (const img of swapped.querySelectorAll('img[id^="screenshot-"]')) {
      const outgoing = outgoingScreenshots.get(img.id);
      if (outgoing) {
        // One that fetches its own frames already has a newer one.
        if (!('refreshSelf' in outgoing.dataset)) {
          swapWhenDecoded(outgoing, img.src);
        }
        img.replaceWith(outgoing);
      }
    }
    for (const canvas of swapped.querySelectorAll('canvas[id^="screencast-"]')) {
      const outgoing = outgoingScreenshots.get(canvas.id);
      const poster = outgoingScreenshots.get(canvas.id.replace('screencast-', 'screenshot-'));
      if (outgoing) {
        canvas.replaceWith(outgoing);
      } else if (poster?.complete && poster.naturalWidth > 0) {
        canvas.width = poster.naturalWidth;
        canvas.height = poster.naturalHeight;
        canvas.getContext('2d').drawImage(poster, 0, 0);
        delete canvas.dataset.awaitingFrame;
      }
    }
  };

  document.body.addEventListener('htmx:beforeSwap', (event) => stashScreenshots(event.detail.target));
  document.body.addEventListener('htmx:afterSwap', (event) => restoreScreenshots(event.detail.elt));
  document.body.addEventListener('htmx:oobBeforeSwap', (event) => stashScreenshots(event.detail.target));
  document.body.addEventListener('htmx:oobAfterSwap', (event) => restoreScreenshots(event.target));
</script>
