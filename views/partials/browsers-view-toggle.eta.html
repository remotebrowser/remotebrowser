<% /* hx-select-oob refreshes this toolbar too, so the selected filter, pressed view, and their URLs follow along. */ %>
<% const currentPath = it.view === 'grid' ? '/browsers/grid' : '/browsers' %>
<div id="browser-toolbar" class="browser-toolbar">
  <label class="status-filter">
    Status
    <select
      name="status"
      hx-get="<%= currentPath %>"
      hx-target="#browser-view"
      hx-select="#browser-view"
      hx-select-oob="#browser-toolbar"
      hx-swap="outerHTML"
      hx-push-url="true"
    >
      <% it.statusFilters.forEach(function(filter) { %> <% const label = filter.charAt(0).toUpperCase() +
      filter.slice(1) %> <% if (filter === it.statusFilter) { %>
      <option value="<%= filter %>" selected><%= label %></option>
      <% } else { %>
      <option value="<%= filter %>"><%= label %></option>
      <% } %> <% }) %>
    </select>
  </label>
  <div class="view-toggle" role="group" aria-label="Browser view">
    <button
      type="button"
      hx-get="/browsers<%= it.statusQuery %>"
      hx-target="#browser-view"
      hx-select="#browser-view"
      hx-select-oob="#browser-toolbar"
      hx-swap="outerHTML"
      hx-push-url="true"
      aria-pressed="<%= it.view === 'list' %>"
    >
      <svg class="view-toggle-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path
          d="M2 3.5h12M2 8h12M2 12.5h12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      List
    </button>
    <button
      type="button"
      hx-get="/browsers/grid<%= it.statusQuery %>"
      hx-target="#browser-view"
      hx-select="#browser-view"
      hx-select-oob="#browser-toolbar"
      hx-swap="outerHTML"
      hx-push-url="true"
      aria-pressed="<%= it.view === 'grid' %>"
    >
      <svg class="view-toggle-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9H7v4.5H2.5zM9 9h4.5v4.5H9z" fill="currentColor" />
      </svg>
      Grid
    </button>
  </div>
</div>
