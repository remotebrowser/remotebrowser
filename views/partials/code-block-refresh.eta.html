<script nonce="<%= it.scriptNonce %>">
  // Same problem as screenshot-refresh.eta.html, different element: an
  // outerHTML swap destroys and recreates every element in the swapped
  // fragment, including the instruction block. The snippet never actually
  // changes once the browser is running, so recreating its node on every 3s
  // poll buys nothing - it just makes the browser replay its "new scrollable
  // content" reveal animation on every poll even though nothing changed.
  // Reusing the same node, and only touching its content when it actually
  // differs, leaves that state alone.
  let outgoingCodeBlocks = new Map();

  document.body.addEventListener('htmx:beforeSwap', (event) => {
    outgoingCodeBlocks = new Map(
      [...event.detail.target.querySelectorAll('[id^="instruction-block-"]')].map((block) => [block.id, block])
    );
  });

  document.body.addEventListener('htmx:afterSwap', (event) => {
    for (const block of event.detail.elt.querySelectorAll('[id^="instruction-block-"]')) {
      const outgoing = outgoingCodeBlocks.get(block.id);
      if (!outgoing) {
        continue;
      }
      if (outgoing.innerHTML !== block.innerHTML) {
        outgoing.innerHTML = block.innerHTML;
      }
      block.replaceWith(outgoing);
    }
    outgoingCodeBlocks.clear();
  });
</script>
