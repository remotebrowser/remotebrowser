<% /* "shown" tells the server which status this page has, so it can announce a change. A terminated browser never
changes again, so it stops polling. */ %> <% if (it.browser.status === 'terminated') { %>
<p id="browser-status"><strong>Status:</strong> <%= it.browser.status %></p>
<% } else { %>
<p
  id="browser-status"
  hx-get="<%= it.statusUrl %>?shown=<%= it.browser.status %>"
  hx-trigger="every 3s"
  hx-swap="outerHTML"
>
  <strong>Status:</strong> <%= it.browser.status %>
</p>
<% } %>
