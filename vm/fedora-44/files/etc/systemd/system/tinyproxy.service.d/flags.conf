# Run tinyproxy as Debian does, with the config that tinyproxy-config builds
# (see /etc/default/tinyproxy). Fedora's unit takes no flags, and makes no
# dir for the pid file.
[Service]
EnvironmentFile=-/etc/default/tinyproxy
ExecStart=
ExecStart=/usr/bin/tinyproxy -d $FLAGS
RuntimeDirectory=tinyproxy
