# Build the config and the filter before every start and reload, so an edit
# to tinyproxy.conf, the upstream proxy, or either list takes effect with a
# reload.
[Service]
ExecStartPre=/usr/local/sbin/tinyproxy-config
ExecStartPre=/usr/local/sbin/tinyproxy-filter
ExecReload=
ExecReload=/usr/local/sbin/tinyproxy-config
ExecReload=/usr/local/sbin/tinyproxy-filter
ExecReload=/bin/kill -USR1 $MAINPID
