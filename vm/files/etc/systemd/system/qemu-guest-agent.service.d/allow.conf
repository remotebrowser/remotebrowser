# The host only uses the agent to set the clock after a VM starts from the
# snapshot or resumes, so allow just that. Setting the clock also starts the
# browser (see chromium-start.timer). The agent's other commands can run programs and
# read files in the guest.
[Service]
ExecStart=
ExecStart=-/usr/sbin/qemu-ga --allow-rpcs=guest-sync,guest-ping,guest-set-time
