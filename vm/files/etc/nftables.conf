#!/usr/sbin/nft -f
# 10.0.2.2 is the host's loopback in QEMU user-mode networking. Refuse new
# connections to it, so the browser cannot reach services that the host only
# exposes to itself, e.g. the app or its database. Only new ones: the app's
# CDP connections arrive from 10.0.2.2, and their replies must get through.
flush ruleset

table ip rb {
  chain output {
    type filter hook output priority 0; policy accept;
    ip daddr 10.0.2.2 ct state new reject
  }
}
