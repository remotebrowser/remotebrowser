# The browser sends all its traffic through this proxy (see browser.env in
# /etc/remotebrowser), so
# this file decides how the browser reaches the internet. After a change in a
# running VM, apply it with `systemctl reload tinyproxy`; a change to Port or
# Listen needs `systemctl restart tinyproxy chromium`.
User tinyproxy
Group tinyproxy

# Only the browser, inside this VM, may use the proxy.
Listen 127.0.0.1
Port 8119
Allow 127.0.0.1

Timeout 600
MaxClients 100
# Log to the journal: `journalctl -u tinyproxy`.
LogLevel Info
DisableViaHeader Yes
DefaultErrorFile "/usr/share/tinyproxy/default.html"
PidFile "/run/tinyproxy/tinyproxy.pid"

# HTTPS goes through CONNECT; allow it only to the usual web ports.
ConnectPort 443
ConnectPort 80

# To send all traffic through another proxy, e.g. for a fixed egress IP:
#Upstream http user:password@proxy.example.com:8080
# or a SOCKS5 proxy:
#Upstream socks5 proxy.example.com:1080
# To skip that proxy for some hosts:
#Upstream none ".example.org"

# Blocked domains: denylist.txt minus allowlist.txt, both next to this file.
# tinyproxy-filter builds this on every start and reload of tinyproxy.
Filter "/run/tinyproxy-filter"
FilterURLs No
FilterType fnmatch
FilterCaseSensitive No
