# The host uses the agent to set the clock after a VM starts from the
# snapshot or resumes, and to write the upstream proxy (see src/vm/proxy.js)
# and the browser's screen size and scale (src/vm/screen-resolution.js,
# src/vm/screen-scale.js), so allow just that.
# Setting the clock also starts the browser (see chromium-start.timer). The
# agent's other commands can run programs and read files in the guest.
[Service]
ExecStart=
ExecStart=-/usr/sbin/qemu-ga --allow-rpcs=guest-sync,guest-ping,guest-set-time,guest-file-open,guest-file-write,guest-file-close
